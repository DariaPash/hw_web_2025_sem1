upstream gunicorn_backend {
    server 127.0.0.1:8000;
}
proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m max_size=100m inactive=60m use_temp_path=off;
server {
    listen 80;
    server_name localhost;
    root /home/b363b63b/WEB_sem1/hw_web_7/hw_web;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;
    location /uploads/ {
        alias /home/b363b63b/WEB_sem1/hw_web_7/hw_web/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location /static/ {
        alias /home/b363b63b/WEB_sem1/hw_web_7/hw_web/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location ~ \.(js|css|jpeg|jpg|png|gif|ico|svg|woff|woff2|ttf|eot|html)$ {
        root /home/b363b63b/WEB_sem1/hw_web_7/hw_web/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location / {
        proxy_pass http://gunicorn_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache my_cache;
        proxy_cache_valid 200 60m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
