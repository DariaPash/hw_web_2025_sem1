{% load static %}

{% block title %}Регистрация - AskDi{% endblock %}

                                     id="avatar-preview" 
                                     class="rounded-circle mb-2"
                                     style="width: 100px; height: 100px; object-fit: cover;" />
                                <input type="file" 
                                       class="form-control form-control-sm" 
                                       id="avatar" 
                                       name="avatar" 
                                       accept="image/*">
                                <div class="form-help">
                                    JPG, PNG до 2MB
                                </div>
                            </div>
                        </div>
                        
                        <div class="col-md-8">
                            <div class="mb-3">
                                <label for="username" class="form-label">Имя пользователя *</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       placeholder="Введите имя пользователя"
                                       maxlength="150"
                                       required
                                       autofocus>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input type="email" 
                                       class="form-control" 
                                       id="email" 
                                       name="email" 
                                       placeholder="Введите email"
                                       maxlength="254"
                                       required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="first_name" class="form-label">Имя</label>
                        <input type="text" 
                               class="form-control" 
                               id="first_name" 
                               name="first_name" 
                               placeholder="Введите имя"
                               maxlength="150">
                    </div>
                    
                    <div class="mb-3">
                        <label for="last_name" class="form-label">Фамилия</label>
                        <input type="text" 
                               class="form-control" 
                               id="last_name" 
                               name="last_name" 
                               placeholder="Введите фамилию"
                               maxlength="150">
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль *</label>
                        <input type="password" 
                               class="form-control" 
                               id="password" 
                               name="password"
                               placeholder="Введите пароль"
                               required>
                        <div class="form-text">
                            Минимум 8 символов. Не должен быть слишком простым или похожим на другую личную информацию.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password2" class="form-label">Подтверждение пароля *</label>
                        <input type="password" 
                               class="form-control" 
                               id="password2" 
                               name="password2"
                               placeholder="Повторите пароль"
                               required>
                    </div>
 
                    <div class="mb-3 form-check">
                        <input type="checkbox" 
                               class="form-check-input" 
                               id="terms" 
                               name="terms" 
                               required>
                        <label class="form-check-label" for="terms">
                            Я согласен с <a href="#" target="_blank">условиями использования</a> и <a href="#" target="_blank">политикой конфиденциальности</a> *
                        </label>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Зарегистрироваться</button>
                    </div>
                </form>
                
                <hr class="my-4">
                
                <div class="text-center">
                    <p class="mb-0">Уже есть аккаунт? <a href="{% url 'login' %}" class="text-decoration-none">Войти</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
